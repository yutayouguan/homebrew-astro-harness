name: bump-cask

# 每小时检查一次主仓库的最新 Release，把 cask 的版本与 sha256 跟到最新。
# 想发版后立即跟版，手动触发即可：
#   gh workflow run bump.yml -R yutayouguan/homebrew-astro-harness
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 用最新 Release 更新 cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="yutayouguan/astro-harness"
          tag=$(gh api "repos/$repo/releases/latest" --jq '.tag_name')
          version="${tag#v}"
          assets=$(gh api "repos/$repo/releases/latest" --jq '.assets[] | "\(.name) \(.digest)"')
          arm_sha=$(echo "$assets" | awk '/aarch64\.dmg/ {print $2}' | sed 's/^sha256://')
          intel_sha=$(echo "$assets" | awk '/x64\.dmg$/ {print $2}' | sed 's/^sha256://')
          if [ -z "$version" ] || [ -z "$arm_sha" ] || [ -z "$intel_sha" ]; then
            echo "::error::无法从 $repo 的最新 Release 读取版本或校验和"
            exit 1
          fi
          # 用逐行 echo 生成：YAML 块里的 heredoc 结束符会被缩进，bash 不认。
          {
            echo 'cask "astro-harness" do'
            echo "  version \"$version\""
            echo ''
            echo '  on_arm do'
            echo "    sha256 \"$arm_sha\""
            echo "    url \"https://github.com/$repo/releases/download/v#{version}/Astro.Harness_#{version}_aarch64.dmg\""
            echo '  end'
            echo '  on_intel do'
            echo "    sha256 \"$intel_sha\""
            echo "    url \"https://github.com/$repo/releases/download/v#{version}/Astro.Harness_#{version}_x64.dmg\""
            echo '  end'
            echo ''
            echo '  name "Astro Harness"'
            echo '  desc "Local-first multimodal AI agent desktop workspace"'
            echo "  homepage \"https://github.com/$repo\""
            echo ''
            echo '  app "Astro Harness.app"'
            echo ''
            echo '  zap trash: ['
            echo '    "~/.astro",'
            echo '  ]'
            echo 'end'
          } > Casks/astro-harness.rb
          echo "version=$version" >> "$GITHUB_ENV"

      - name: 提交（有变化时）
        run: |
          if git diff --quiet; then
            echo "cask 已是最新（$version）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cask: bump astro-harness to $version"
          git push
