name: bump-cask

# 每小时检查一次主仓库的最新 Release，把 cask 的版本与 sha256 跟到最新。
# 想发版后立即跟版，手动触发即可：
#   gh workflow run bump.yml -R yutayouguan/homebrew-astro-harness
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略“已是最新”判断，强制重新下载校验并重写 cask"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 用最新 Release 更新 cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="yutayouguan/astro-harness"
          tag=$(gh api "repos/$repo/releases/latest" --jq '.tag_name')
          version="${tag#v}"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::无法从 $repo 读取最新 Release 版本"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

          current=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/astro-harness.rb | head -1)
          if [ "$current" = "$version" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "cask 已是最新（$version），跳过下载"
            exit 0
          fi

          # release assets 的 digest 字段用仓库自带 token 取不到，直接下载后自己算。
          work=$(mktemp -d)
          gh release download --repo "$repo" --pattern '*aarch64.dmg' --dir "$work" --clobber
          gh release download --repo "$repo" --pattern '*x64.dmg' --dir "$work" --clobber
          arm_file=$(ls "$work"/*aarch64.dmg | head -1)
          intel_file=$(ls "$work"/*x64.dmg | head -1)
          arm_sha=$(sha256sum "$arm_file" | awk '{print $1}')
          intel_sha=$(sha256sum "$intel_file" | awk '{print $1}')
          if [ -z "$arm_sha" ] || [ -z "$intel_sha" ]; then
            echo "::error::未能计算安装包校验和"
            exit 1
          fi
          # 用逐行 echo 生成：YAML 块里的 heredoc 结束符会被缩进，bash 不认。
          {
            echo 'cask "astro-harness" do'
            echo "  version \"$version\""
            echo ''
            echo '  on_arm do'
            echo "    sha256 \"$arm_sha\""
            echo "    url \"https://github.com/$repo/releases/download/v#{version}/Astro.Harness_#{version}_aarch64.dmg\""
            echo '  end'
            echo '  on_intel do'
            echo "    sha256 \"$intel_sha\""
            echo "    url \"https://github.com/$repo/releases/download/v#{version}/Astro.Harness_#{version}_x64.dmg\""
            echo '  end'
            echo ''
            echo '  name "Astro Harness"'
            echo '  desc "Local-first multimodal AI agent desktop workspace"'
            echo "  homepage \"https://github.com/$repo\""
            echo ''
            echo '  app "Astro Harness.app"'
            echo ''
            echo '  zap trash: ['
            echo '    "~/.astro",'
            echo '  ]'
            echo 'end'
          } > Casks/astro-harness.rb

      - name: 提交（有变化时）
        run: |
          if git diff --quiet; then
            echo "cask 已是最新（$version）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cask: bump astro-harness to $version"
          git push
